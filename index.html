<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدخال معلم جديد</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f1f5f9;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .form-card {
      background: #ffffff;
      width: 100%;
      max-width: 900px;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .form-title {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      font-size: 18px;
      font-weight: bold;
      color: #0f172a;
      margin-bottom: 20px;
    }

    /* قسم البيانات الأساسية للمعلم */
    .top-inputs-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 13px;
      color: #475569;
      font-weight: 600;
    }

    .input-group input {
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      background-color: #f8fafc;
      outline: none;
    }

    .input-group input:focus {
      border-color: #2563eb;
      background-color: #fff;
    }

    .section-divider-title {
      text-align: center;
      color: #0f766e;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 16px;
    }

    /* شبكة المراحل الدراسية */
    .grades-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    /* بطاقة الصف/المرحلة */
    .grade-card {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px;
      background-color: #ffffff;
      min-height: 180px;
    }

    .grade-card.active {
      border-color: #3b82f6;
      box-shadow: 0 0 0 1px #3b82f6;
    }

    /* هيدر البطاقة متضمن حقل الحصص الجديد */
    .grade-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      border-bottom: 1px solid #f1f5f9;
      margin-bottom: 12px;
    }

    .grade-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      color: #1e293b;
      font-size: 14px;
    }

    .classes-count-box {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #64748b;
    }

    .classes-count-box input {
      width: 45px;
      padding: 4px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      text-align: center;
      font-size: 12px;
    }

    /* مربع الشعبة وزر الحذف داخل المربع */
    .section-box {
      position: relative; /* لضبط تموضّع زر الحذف داخلياً */
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      background-color: #f8fafc;
      overflow: hidden; /* يضمن عدم خروج الزر عن الحواف */
    }

    .delete-section-btn {
      position: absolute;
      top: 6px;
      left: 6px; /* تثبيت الزر داخل الزاوية اليسرى */
      width: 20px;
      height: 20px;
      border: none;
      background-color: #fee2e2;
      color: #ef4444;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      line-height: 1;
    }

    .delete-section-btn:hover {
      background-color: #fca5a5;
      color: #991b1b;
    }

    .section-name {
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 8px;
    }

    .subjects-selects {
      display: flex;
      gap: 6px;
    }

    .subjects-selects select {
      width: 50%;
      padding: 6px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 12px;
      background-color: #fff;
      color: #475569;
    }

    /* زر الحفظ السفلي */
    .submit-btn {
      width: 100%;
      background-color: #059669;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .submit-btn:hover {
      background-color: #047857;
    }
  </style>
</head>
<body>

  <div class="form-card">
    <div class="form-title">
      <span>إدخال معلم جديد</span>
      <span>👤+</span>
    </div>

    <!-- 1. تم تعديل الهيدر: حذف حقل عدد الحصص الكلي من الأعلى -->
    <div class="top-inputs-grid">
      <div class="input-group">
        <label>اسم المعلم:</label>
        <input type="text" placeholder="مثال: أستاذ علي">
      </div>
      <div class="input-group">
        <label>صورة المعلم:</label>
        <input type="file">
      </div>
      <div class="input-group">
        <label>رقم الواتساب:</label>
        <input type="text" placeholder="07700000000">
      </div>
    </div>

    <div class="section-divider-title">حددي الصف والشعبة والمادة المخصصة للمعلم</div>

    <!-- 2. شبكة الصفوف وتضمين "عدد الحصص" وضبط زر الحذف داخل المربع -->
    <div class="grades-grid">

      <!-- الصف الأول (مفعل) -->
      <div class="grade-card active">
        <div class="grade-header">
          <label class="grade-title-wrap">
            <input type="checkbox" checked>
            <span>الصف الأول</span>
          </label>
          <!-- نقل عدد الحصص داخل المرحلة -->
          <div class="classes-count-box">
            <label>الحصص:</label>
            <input type="number" value="12" min="1">
          </div>
        </div>

        <!-- الشعبة أ -->
        <div class="section-box">
          <button class="delete-section-btn" title="حذف الشعبة">✕</button>
          <div class="section-name">شعبة أ</div>
          <div class="subjects-selects">
            <select><option>المادة الأولى</option></select>
            <select><option>المادة الثانية</option></select>
          </div>
        </div>

        <!-- الشعبة ب -->
        <div class="section-box">
          <button class="delete-section-btn" title="حذف الشعبة">✕</button>
          <div class="section-name">شعبة ب</div>
          <div class="subjects-selects">
            <select><option>المادة الأولى</option></select>
            <select><option>المادة الثانية</option></select>
          </div>
        </div>
      </div>

      <!-- الصف الثاني -->
      <div class="grade-card">
        <div class="grade-header">
          <label class="grade-title-wrap">
            <input type="checkbox">
            <span>الصف الثاني</span>
          </label>
          <div class="classes-count-box">
            <label>الحصص:</label>
            <input type="number" placeholder="0" min="1">
          </div>
        </div>
      </div>

      <!-- الصف الثالث -->
      <div class="grade-card">
        <div class="grade-header">
          <label class="grade-title-wrap">
            <input type="checkbox">
            <span>الصف الثالث</span>
          </label>
          <div class="classes-count-box">
            <label>الحصص:</label>
            <input type="number" placeholder="0" min="1">
          </div>
        </div>
      </div>

      <!-- الصف الرابع -->
      <div class="grade-card">
        <div class="grade-header">
          <label class="grade-title-wrap">
            <input type="checkbox">
            <span>الصف الرابع</span>
          </label>
          <div class="classes-count-box">
            <label>الحصص:</label>
            <input type="number" placeholder="0" min="1">
          </div>
        </div>
      </div>

      <!-- الصف الخامس -->
      <div class="grade-card">
        <div class="grade-header">
          <label class="grade-title-wrap">
            <input type="checkbox">
            <span>الصف الخامس</span>
          </label>
          <div class="classes-count-box">
            <label>الحصص:</label>
            <input type="number" placeholder="0" min="1">
          </div>
        </div>
      </div>

      <!-- الصف السادس -->
      <div class="grade-card">
        <div class="grade-header">
          <label class="grade-title-wrap">
            <input type="checkbox">
            <span>الصف السادس</span>
          </label>
          <div class="classes-count-box">
            <label>الحصص:</label>
            <input type="number" placeholder="0" min="1">
          </div>
        </div>
      </div>

    </div>

    <button class="submit-btn">+ حفظ المعلم وتوليد الجدول</button>
  </div>

</body>
</html>
